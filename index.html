
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>個股技術走勢儀表板</title>
<style>
  :root{
    --bg:#1B2A4A; --card:#253660; --card2:#1F3050;
    --gold:#F5C518; --body:#C0CCDD; --muted:#7C8BA5; --white:#FFFFFF;
    --up:#27AE60;   /* 漲/多頭＝綠（綠漲紅跌） */
    --down:#E4572E; /* 跌/空頭＝紅 */
    --flat:#7C8BA5;
    --line:#33456b;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--body);
    font-family:"Noto Sans CJK TC","Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:1240px; margin:0 auto; padding:28px 20px 60px; }
  header .kicker{ color:var(--gold); font-weight:700; letter-spacing:1px; font-size:14px; }
  header h1{ color:var(--white); font-size:30px; margin:6px 0 4px; }
  .meta{ color:var(--muted); font-size:13px; }
  .overall{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin:18px 0 10px; line-height:1.7; color:var(--body); font-size:15.5px;
  }
  .overall b{ color:var(--gold); }
  .legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:6px 2px 20px; }
  .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  /* 資金熱門板塊 */
  .sectors{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin:6px 0 18px; }
  .sec-title{ color:var(--gold); font-weight:700; font-size:15.5px; margin-bottom:12px; }
  .sec-row{ display:flex; align-items:center; gap:12px; margin:8px 0; }
  .sec-name{ width:70px; color:var(--white); font-size:14px; font-weight:600; flex:none; }
  .sec-bar{ flex:1; height:16px; background:var(--card2); border-radius:8px; overflow:hidden; }
  .sec-fill{ height:100%; border-radius:8px; min-width:2px; }
  .sec-val{ width:110px; text-align:right; font-size:13px; font-weight:700; flex:none; }
  .sec-hint{ color:var(--muted); font-size:11.5px; margin-top:10px; }
  .sector-tag{ font-size:11px; color:var(--muted); background:var(--card2); padding:2px 9px; border-radius:999px; margin-left:8px; vertical-align:middle; }
  .flow{ font-size:13.5px; font-weight:700; padding:8px 11px; border-radius:8px; background:var(--card2); }
  .flow.in{ color:var(--up); } .flow.out{ color:var(--down); }

  /* ── 版面：手機 1 欄、桌機最多 2 欄，讓每張卡片與圖都寬 ── */
  .grid{ display:grid; grid-template-columns:1fr; gap:20px; }
  @media (min-width:1000px){ .grid{ grid-template-columns:1fr 1fr; } }

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:12px;
  }
  .card.err{ opacity:.7; }
  .card-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .sym{ font-size:22px; font-weight:800; color:var(--white); letter-spacing:.5px; }
  .badge{ font-size:13px; font-weight:800; padding:5px 12px; border-radius:999px; color:#12203b; white-space:nowrap; }
  .b-up{ background:var(--up); color:#fff; }
  .b-down{ background:var(--down); color:#fff; }
  .b-flat{ background:var(--flat); color:#12203b; }
  .price{ font-size:15px; color:var(--body); }
  .price .close{ color:var(--white); font-weight:700; font-size:20px; }
  .stats{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px 14px; }
  .stat{ background:var(--card2); border-radius:10px; padding:8px 11px; }
  .stat .k{ font-size:11.5px; color:var(--muted); }
  .stat .v{ font-size:16px; font-weight:700; color:var(--white); margin-top:2px; }
  .v.pos{ color:var(--up); } .v.neg{ color:var(--down); }
  .rsi-hot{ color:var(--up); } .rsi-cold{ color:var(--down); }
  .chart-tabs{ display:flex; gap:6px; margin-bottom:-2px; }
  .chart-tabs .tab{
    font:inherit; font-size:12.5px; font-weight:700; cursor:pointer;
    color:var(--body); background:var(--card2); border:1px solid var(--line);
    border-bottom:none; border-radius:8px 8px 0 0; padding:6px 14px;
  }
  .chart-tabs .tab.active{ background:var(--gold); color:#12203b; border-color:var(--gold); }
  .chart-tabs .tab:disabled{ opacity:.4; cursor:not-allowed; }
  /* 一次只顯示一張大圖，圖用滿卡片寬度、拉高，點圖可放大 */
  .chart{ border-radius:0 10px 10px 10px; overflow:hidden; background:#f5f7fb; border:1px solid var(--line); min-height:260px; }
  .chart.single{ border-radius:10px; background:#1B2A4A; }
  .chart img{ display:block; width:100%; height:auto; cursor:zoom-in; }
  .chart .noimg{ padding:60px 10px; text-align:center; color:#6b7890; font-size:12.5px; }
  .chart-hint{ font-size:11.5px; color:var(--muted); margin:6px 2px 0; }
  .ai{ background:var(--card2); border-left:3px solid var(--gold); border-radius:8px; padding:11px 13px; font-size:13.5px; line-height:1.65; color:var(--body); }
  .ai .tag{ color:var(--gold); font-weight:700; font-size:12px; display:block; margin-bottom:3px; }
  .err-msg{ color:var(--muted); font-size:13px; }
  footer{ margin-top:34px; text-align:center; color:var(--muted); font-size:12.5px; line-height:1.7; }
  .src{ color:#5f6f8c; }
  @media (max-width:520px){ header h1{ font-size:24px; } .wrap{ padding:20px 14px 48px; } }
</style>
</head>

function fmt(n){ return (n===null||n===undefined||isNaN(n)) ? "—" : (Math.round(n*100)/100).toLocaleString(); }
function fmtFlow(n){ if(n===null||n===undefined||isNaN(n)) return "—"; const a=Math.abs(n); if(a>=1e8) return (a/1e8).toFixed(1)+"億"; if(a>=1e4) return Math.round(a/1e4)+"萬"; return Math.round(a).toLocaleString(); }
// 資金板塊泡泡圖（仿 tide 潮汐）：x=資金流向、y=流速、size=金額，四象限
function renderSectors(data){
  const el = document.getElementById("sectors");
  const secs = (data.sectors||[]).filter(s=>s && (s.x!=null || s.netFlow!=null));
  if(!secs.length){ el.style.display="none"; return; }
  el.style.display="";
  // 相容：若沒有 x（舊資料），用 netFlow 當 x、其它給 0
  secs.forEach(s=>{ if(s.x==null) s.x=s.netFlow||0; if(s.y==null) s.y=0; if(s.size==null) s.size=Math.abs(s.netFlow||0); });

  const W=820,H=480,padL=60,padR=30,padT=45,padB=52;
  const px0=padL,px1=W-padR,py0=padT,py1=H-padB;
  const midX=(px0+px1)/2, midY=(py0+py1)/2, halfW=(px1-px0)/2, halfH=(py1-py0)/2;
  const maxX=Math.max(1,...secs.map(s=>Math.abs(s.x||0)));
  const maxY=Math.max(1,...secs.map(s=>Math.abs(s.y||0)));
  const maxSize=Math.max(1,...secs.map(s=>Math.abs(s.size||0)));
  const sgn=v=>v<0?-1:1;
  const sx=v=>midX+sgn(v)*Math.sqrt(Math.abs(v)/maxX)*halfW*0.82;   // signed-sqrt：讓靠近 0 的也散得開
  const sy=v=>midY-sgn(v)*Math.sqrt(Math.abs(v)/maxY)*halfH*0.82;
  const sr=v=>10+Math.sqrt(Math.abs(v)/maxSize)*34;
  const up="var(--up)", down="var(--down)", ql="rgba(192,204,221,0.5)", mut="var(--muted)";

  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">';
  svg+='<rect x="'+px0+'" y="'+py0+'" width="'+(px1-px0)+'" height="'+(py1-py0)+'" fill="none" stroke="rgba(255,255,255,0.08)"/>';
  svg+='<line x1="'+midX+'" y1="'+py0+'" x2="'+midX+'" y2="'+py1+'" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/>';
  svg+='<line x1="'+px0+'" y1="'+midY+'" x2="'+px1+'" y2="'+midY+'" stroke="rgba(255,255,255,0.14)" stroke-dasharray="4 4"/>';
  // 四象限標籤
  svg+='<text x="'+(px1-8)+'" y="'+(py0+16)+'" text-anchor="end" font-size="13" fill="'+ql+'">漲潮加速</text>';
  svg+='<text x="'+(px1-8)+'" y="'+(py1-8)+'" text-anchor="end" font-size="13" fill="'+ql+'">漲潮放緩</text>';
  svg+='<text x="'+(px0+8)+'" y="'+(py1-8)+'" text-anchor="start" font-size="13" fill="'+ql+'">退潮加速</text>';
  svg+='<text x="'+(px0+8)+'" y="'+(py0+16)+'" text-anchor="start" font-size="13" fill="'+ql+'">退潮放緩</text>';
  // 軸向
  svg+='<text x="'+midX+'" y="'+(py0-4)+'" text-anchor="middle" font-size="11" fill="'+mut+'">↑ 流速加快</text>';
  svg+='<text x="'+midX+'" y="'+(py1+34)+'" text-anchor="middle" font-size="11" fill="'+mut+'">↓ 流速放緩</text>';
  svg+='<text x="'+px1+'" y="'+(py1+20)+'" text-anchor="end" font-size="11" fill="'+mut+'">法人買超 →</text>';
  svg+='<text x="'+px0+'" y="'+(py1+20)+'" text-anchor="start" font-size="11" fill="'+mut+'">← 法人賣超</text>';
  // 泡泡：先算位置，做簡單防重疊，再畫
  const nodes=secs.map(s=>({s, cx:sx(s.x||0), cy:sy(s.y||0), r:sr(s.size||0), col:(s.x||0)>=0?up:down}));
  for(let iter=0; iter<90; iter++){
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j]; let dx=b.cx-a.cx, dy=b.cy-a.cy; let d=Math.sqrt(dx*dx+dy*dy)||0.01; const min=a.r+b.r+6;
      if(d<min){ const p=(min-d)/2, ux=dx/d, uy=dy/d; a.cx-=ux*p; a.cy-=uy*p; b.cx+=ux*p; b.cy+=uy*p; }
    }
    nodes.forEach(n=>{ n.cx=Math.max(px0+n.r, Math.min(px1-n.r, n.cx)); n.cy=Math.max(py0+n.r, Math.min(py1-n.r, n.cy)); });
  }
  nodes.sort((a,b)=>b.r-a.r); // 大的先畫，小的與標籤在上層
  nodes.forEach(n=>{ const s=n.s;
    const tip=s.sector+'：近5日 '+fmtFlow(s.x)+'、流速 '+fmtFlow(s.y)+'、金額 '+fmtFlow(s.size);
    const ly = n.r>=20 ? n.cy+4 : n.cy-n.r-5;
    svg+='<g><title>'+tip+'</title>';
    svg+='<circle cx="'+n.cx.toFixed(1)+'" cy="'+n.cy.toFixed(1)+'" r="'+n.r.toFixed(1)+'" fill="'+n.col+'" fill-opacity="0.28" stroke="'+n.col+'" stroke-width="2"/>';
    svg+='<text x="'+n.cx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff">'+s.sector+'</text>';
    svg+='</g>';
  });
  svg+='</svg>';

  el.innerHTML = '<div class="sec-title">今日資金板塊泡泡圖（三大法人）</div>'+svg
    +'<div class="sec-hint">→右：法人買超　←左：法人賣超　↑上：加速　↓下：放緩　泡泡大小＝近20日成交金額。'
    +(data.flowNote||"資金流向＝三大法人買賣超（FinMind）")+'</div>';
}
function trendClass(t){ return t==="多頭" ? "b-up" : t==="空頭" ? "b-down" : "b-flat"; }
function fmtTime(iso){
  if(!iso) return "—";
  try{ const d=new Date(iso); if(isNaN(d)) return iso;
    const p=(x)=>String(x).padStart(2,"0");
    return d.getFullYear()+" / "+p(d.getMonth()+1)+" / "+p(d.getDate())+"  "+p(d.getHours())+":"+p(d.getMinutes());
  }catch(e){ return iso; }
}

function render(data){
  document.getElementById("meta").textContent = "更新時間：" + fmtTime(data.generatedAt) + "　·　共 " + (data.count ?? (data.items||[]).length) + " 檔";
  const ov = document.getElementById("overall");
  if(data.overall){ ov.innerHTML = "<b>今日整體：</b>" + data.overall; ov.style.display=""; }
  else { ov.style.display="none"; }
  renderSectors(data);
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  (data.items||[]).forEach(it=>{
    const card = document.createElement("div");
    card.className = "card" + (it.error ? " err" : "");
    if(it.error){
      card.innerHTML = '<div class="card-top"><span class="sym">'+it.symbol+'</span><span class="badge b-flat">資料異常</span></div>'
        + '<div class="err-msg">'+it.error+'</div>';
      grid.appendChild(card); return;
    }
    const histCls = (it.macdHist>0)?"pos":(it.macdHist<0)?"neg":"";
    const rsiCls = (it.rsi14>=70)?"rsi-hot":(it.rsi14<=30)?"rsi-cold":"";
    const combo = it.comboChartUrl || null;            // K棒×均線 合併圖（新版主圖）
    const candle = it.candleChartUrl || null;
    const ma = it.maChartUrl || it.chartUrl || null;   // 相容舊欄位 chartUrl
    let chart;
    if(combo){
      // 一張合併圖：K棒 + MA5 + MA20 疊在一起
      chart = '<div class="chart single"><img loading="lazy" class="chart-img" src="'+combo+'"'
          +' alt="'+it.symbol+' K棒×均線" title="點圖可放大檢視"'
          +' onerror="this.parentNode.innerHTML=&quot;<div class=noimg>圖表載入失敗</div>&quot;"/></div>'
        +'<div class="chart-hint">K棒 × 均線疊圖 · 點圖可放大</div>';
    } else {
      // 相容舊資料：K棒 / 均線 分頁切換
      const first = ma || candle;
      chart = first
        ? '<div class="chart-tabs">'
            +'<button type="button" class="tab'+(ma?' active':'')+'" data-view="ma"'+(ma?'':' disabled')+'>均線</button>'
            +'<button type="button" class="tab'+(!ma&&candle?' active':'')+'" data-view="candle"'+(candle?'':' disabled')+'>K棒</button>'
          +'</div>'
          +'<div class="chart"><img loading="lazy" class="chart-img" src="'+first+'"'
            +' data-candle="'+(candle||'')+'" data-ma="'+(ma||'')+'"'
            +' alt="'+it.symbol+' 走勢圖" title="點圖可放大檢視"'
            +' onerror="this.parentNode.innerHTML=&quot;<div class=noimg>圖表載入失敗（可點對應 chartUrl 檢視）</div>&quot;"/></div>'
          +'<div class="chart-hint">用上方分頁切換 K棒／均線 · 點圖可放大</div>'
        : '<div class="chart"><div class="noimg">（範例無圖，實際跑會帶入 QuickChart 的 K棒×均線 疊圖）</div></div>';
    }
    card.innerHTML =
      '<div class="card-top"><span><span class="sym">'+it.symbol+'</span>'
        +(it.sector?'<span class="sector-tag">'+it.sector+'</span>':'')+'</span>'
        +'<span class="badge '+trendClass(it.trend)+'">'+(it.trend||"—")+'</span></div>'
      +'<div class="price">收盤 <span class="close">'+fmt(it.close)+'</span></div>'
      +'<div class="stats">'
        +'<div class="stat"><div class="k">MA5</div><div class="v">'+fmt(it.ma5)+'</div></div>'
        +'<div class="stat"><div class="k">MA20</div><div class="v">'+fmt(it.ma20)+'</div></div>'
        +'<div class="stat"><div class="k">RSI(14)</div><div class="v '+rsiCls+'">'+fmt(it.rsi14)+'</div></div>'
        +'<div class="stat"><div class="k">MACD 柱狀</div><div class="v '+histCls+'">'+fmt(it.macdHist)+'</div></div>'
      +'</div>'
      + ((it.netFlowEst!==null && it.netFlowEst!==undefined)
          ? '<div class="flow '+(it.netFlowEst>=0?'in':'out')+'">資金流向(三大法人)　'+(it.netFlowEst>=0?'買超 ':'賣超 ')+fmtFlow(it.netFlowEst)+'</div>'
          : '')
      + chart
      + (it.aiComment ? '<div class="ai"><span class="tag">AI 白話解讀</span>'+it.aiComment+'</div>' : '');
    grid.appendChild(card);
  });
}

// K棒 / 均線 切換
document.getElementById("grid").addEventListener("click", function(e){
  const btn = e.target.closest(".tab");
  if(btn && !btn.disabled){
    const card = btn.closest(".card");
    const img = card.querySelector(".chart-img");
    if(!img) return;
    const url = btn.dataset.view === "candle" ? img.dataset.candle : img.dataset.ma;
    if(!url) return;
    img.src = url;
    card.querySelectorAll(".chart-tabs .tab").forEach(t=>t.classList.toggle("active", t===btn));
    return;
  }
  // 點圖：在新分頁開原圖，用瀏覽器看更大
  const im = e.target.closest(".chart-img");
  if(im && im.src){ window.open(im.src, "_blank", "noopener"); }
});

fetch("data.json", { cache:"no-store" })
  .then(r=>{ if(!r.ok) throw new Error("no data.json"); return r.json(); })
  .then(render)
  .catch(()=>{ render(SAMPLE); });
</script>
</body>
</html>
